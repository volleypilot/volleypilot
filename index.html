<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VolleyPilot App</title>
<style>
  /* COLORS */
  :root {
    --primary-bg: #00ae4d;
    --header-overlay: rgba(0, 0, 0, 0.2);
    --button-overlay: rgba(255, 255, 0, 0.2);
    --primary-text: #FFFFFF;
    --accent-text: #FFFF00;
    --error-text: #FF0000;
  }

  /* GENERAL STYLES */
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--primary-bg);
    color: var(--primary-text);
    line-height: 1.6;
  }

  h1 {
    text-align: center;
    font-size: 2.5rem; /* headline style */
    margin-top: 40px;
  }

  h2 {
    font-size: 1.5rem; /* subheadline */
    margin-top: 30px;
    margin-bottom: 10px;
  }

  p {
    text-align: left; /* body text leading */
    font-size: 1rem;
    margin-bottom: 15px;
  }

  a {
    color: var(--accent-text);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .card {
    background: var(--header-overlay);
    border-radius: 12px;
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
  }

  .button {
    display: inline-block;
    background: var(--accent-text);
    color: var(--primary-bg);
    border: 2px solid var(--accent-text);
    border-radius: 16px;
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 600;
    margin-top: 10px;
    cursor: pointer;
    transition: transform 0.22s cubic-bezier(0.25, 0.85, 0.25, 1), border-width 0.1s;
  }

  .button:active {
    transform: scale(0.97);
    border-width: 3px;
    background-color: var(--button-overlay);
  }

  footer {
    margin-top: 40px;
    font-size: 0.85rem;
    color: var(--primary-text);
    text-align: center;
  }
</style>
</head>
<body>

<h1>VolleyPilot</h1>

<div class="card">
  <p>VolleyPilot is a smart volleyball score and statistics app designed to help coaches, players, and teams track performance in real time.</p>

  <h2>Contact</h2>
  <p>Email: <a href="mailto:volleypilot.app@gmail.com">volleypilot.app@gmail.com</a></p>

  <h2>Terms & Privacy</h2>
  <p><a class="button" href="privacy.html">Privacy Policy & Terms of Use</a></p>
</div>

<footer>
  &copy; 2025 VolleyPilot
</footer>

</body>
</html>
